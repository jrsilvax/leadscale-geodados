name: 2 - Processar estado (setores censitários)
on:
  workflow_dispatch:
    inputs:
      uf:
        description: "Sigla do estado (ex.: SP)"
        required: true
        default: "SP"
permissions:
  contents: write
jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas geopandas pyogrio openpyxl
      - run: python tools/processar_uf.py "${{ github.event.inputs.uf }}"
      - name: Salvar no repositório
        run: |
          git config user.name "geodados-bot"
          git config user.email "geodados-bot@users.noreply.github.com"
          git add data catalogo
          git commit -m "Setores censitários ${{ github.event.inputs.uf }}" || echo "nada novo"
          git pull --rebase
          git push
